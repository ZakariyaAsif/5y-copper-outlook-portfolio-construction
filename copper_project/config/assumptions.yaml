project:
  base_currency: CAD
  research_frequency: monthly
  market_data_frequency: annual
  copper_fundamentals_frequency: annual
  forecast_horizon_start: "2026-09-01"
  forecast_horizon_end: "2031-08-31"

date_handling:
  monthly_date_convention: month_end
  annual_date_convention: calendar_year_end
  timezone: America/Toronto
  duplicate_policy: investigate_and_resolve

missing_data:
  missing_value_policy: retain_as_nan
  interpolation_allowed: false
  forward_fill_allowed: false

copper_price:
  preferred_series: PCOPPUSDM
  selected_vintage: "2026-07-13"
  vintage_policy: fixed_vintage_for_current_analysis
  currency: USD
  unit: metric_tonne
  price_type: monthly_period_average

secondary_refined_production:
  frequency: annual
  unit: thousand_metric_tonnes
  source_method: WebPlotDigitizer
  calculation:
    formula: secondary_boundary_minus_primary_boundary
  precision: approximate
  reporting_rounding_kt: 10

copper_fundamentals:
  frequency: annual
  unit: thousand_metric_tonnes
  refined_balance_formula: refined_production_minus_refined_usage
  positive_balance_interpretation: surplus
  negative_balance_interpretation: deficit
  annual_to_monthly_interpolation: false
  preliminary_observations_retained: true

returns:
  price_return_method: logarithmic
  real_return_method: compound_nominal_and_inflation
  real_return_formula: ((1 + nominal_return) / (1 + inflation)) - 1
  annualization_basis: 12

hypothesis:
  bullish_definition:
    sustained_deficits: true
    falling_inventories: true
    delayed_supply_response: true
    strong_electrification_demand: true